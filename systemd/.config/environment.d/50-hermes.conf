# Environment for the Hermes user units on snoc-beelink.
#
# ~/.config/environment.d/*.conf is read by the systemd *user* manager and
# applied to every user unit it starts. That is the whole reason
# hermes-webui.service is a user unit rather than the system unit it used to
# be: a system unit gets none of this, and its old workaround -- an ExecStart
# of `bash -lc` so the login profile would be sourced -- made the service's
# environment depend on the interactive shell config, which is a long way to
# go for two variables.
#
# This file is not a secret and must not become one. Credentials for Hermes
# live in ~/.hermes/.env, projected from secrets/.secrets.env by
# batesste-homesetup/hermes/sync-secrets.sh. Anything in here is world-
# readable as far as every user unit is concerned.
#
# Changes need `systemctl --user daemon-reload` and a restart of the unit;
# confirm with `systemctl --user show-environment`.

# --- hermes-webui: the workspace Git panel ---
#
# WebUI refuses every mutating Git operation -- stage, unstage, discard,
# commit, checkout, pull, push -- unless this is set. Default off upstream,
# which is the right default for a deployment where the browser side is not
# trusted. Here it is: the listener is on 127.0.0.1:8787 behind nginx basic
# auth, and the only thing it can reach is ~/.hermes/workspace.
#
# This is what "Hermex cannot commit" was.
HERMES_WEBUI_WORKSPACE_GIT_DESTRUCTIVE=1

# Keeps GPG signing on for those commits.
#
# Upstream hardcodes `-c commit.gpgSign=false -c gpg.program=` on every
# mutating call, and a command-line -c beats .gitconfig, so enabling the flag
# above on its own produces unsigned commits with no warning. This variable
# is a local patch to api/workspace_git.py in ~/Projects/hermes-webui, which
# makes those three overrides conditional; it does nothing on an unpatched
# checkout, which is the failure mode you want if the patch is ever lost to a
# pull. Signing uses the unprotected subkey C04A6C77619F802A -- gpg-agent
# never needs to prompt; see gpg/.gnupg/gpg-agent.conf for details.
HERMES_WEBUI_WORKSPACE_GIT_SIGN=1

# Bind address and port. nginx proxies /hermes here, and the bind stays on
# loopback so the only route in is through nginx's basic auth.
HERMES_WEBUI_HOST=127.0.0.1
HERMES_WEBUI_PORT=8787

# Add the location of the hermes-webui workspace which we place inside
# the hermes tree itself.
HERMES_WEBUI_DEFAULT_WORKSPACE=/home/batesste/.hermes/webui/workspace
