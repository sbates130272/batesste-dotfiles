allow-loopback-pinentry
pinentry-program /usr/bin/pinentry-curses

# Cache the primary key's passphrase for a working day.
#
# pinentry-curses needs a terminal. A background signer has none -- the
# hermes-webui user unit committing into ~/.hermes/workspace is the case this
# is for -- so if the agent has to ask, the commit does not fail cleanly, it
# blocks until git's 60s remote timeout.
#
# Signing no longer depends on that cache. Subkey C04A6C77619F802A is
# signing-only and unprotected, and user.signingkey names it with a trailing
# "!" so gpg cannot fall back to the primary. The daemon signs whether or not
# anyone has logged in. The primary stays [SC] and passphrase-protected, so
# certifying a key -- signing someone else's, editing trust, adding subkeys --
# still costs an interactive prompt.
#
# What the long TTL buys now is only that: not retyping the passphrase for
# every certification in a session. The defaults are 600s idle and 2h
# absolute, tight enough to ask twice in one sitting.
#
# The trade is explicit: an unlocked session holds a usable certification key
# for up to twelve hours. That is the same window as the screen lock, on a box
# that is not shared -- and the signing key is usable for longer than that
# regardless, which is the point of the split.
default-cache-ttl 43200
max-cache-ttl 43200
