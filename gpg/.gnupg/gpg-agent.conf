allow-loopback-pinentry
pinentry-program /usr/bin/pinentry-curses

# Cache the primary key's passphrase for a working day so certification
# operations (signing someone else's key, adding subkeys) don't prompt twice
# in one sitting. Signing and decryption also benefit, but those are the
# common cases that motivate the long TTL.
default-cache-ttl 43200
max-cache-ttl 43200
