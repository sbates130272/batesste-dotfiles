allow-loopback-pinentry
pinentry-program /usr/bin/pinentry-curses

# Cache the signing passphrase for a working day.
#
# pinentry-curses needs a terminal. A background signer has none -- the
# hermes-webui user unit committing into ~/.hermes/workspace is the case this
# is for -- so if the agent has to ask, the commit does not fail cleanly, it
# blocks until git's 60s remote timeout. Cached, it never asks.
#
# The defaults are 600s idle and 2h absolute, which meant the first commit of
# the morning worked and the ones after lunch hung. 12h absolute makes one
# interactive sign per boot enough to cover the day; the idle timer is set to
# match so a quiet afternoon does not expire it early.
#
# The trade is explicit: an unlocked session holds a usable signing key for
# up to twelve hours. That is the same window as the screen lock, on a box
# that is not shared.
default-cache-ttl 43200
max-cache-ttl 43200
