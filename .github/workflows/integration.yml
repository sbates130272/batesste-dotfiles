name: Integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-install:
    name: install and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Dependencies ────────────────────────────────────────────────────────
      - name: Install apt dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            stow git git-crypt gettext-base \
            emacs-nox \
            ansible \
            python3-pip unzip curl

      - name: Install AWS CLI v2
        run: |
          # AWS CLI v2 is pre-installed on GitHub Actions runners; skip if present.
          if command -v aws &>/dev/null; then
            echo "aws already installed: $(aws --version)"
          else
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscliv2.zip /tmp/aws
            aws --version
          fi

      - name: Install gh CLI
        run: |
          # gh is not always in the default Ubuntu repos. Use GitHub's official
          # apt source so we get a consistent version across matrix runners.
          type -p gh &>/dev/null && { echo "gh already installed: $(gh --version | head -1)"; exit 0; }
          sudo mkdir -p -m 755 /etc/apt/keyrings
          wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q gh

      # ── git-crypt unlock ────────────────────────────────────────────────────
      # GIT_CRYPT_KEY_BASE64 is the symmetric git-crypt key, base64-encoded.
      # Generate it from your local checkout with:
      #   git-crypt export-key /tmp/dotfiles.key && base64 -w0 /tmp/dotfiles.key
      # Then add the output as the GIT_CRYPT_KEY_BASE64 repo secret.
      - name: Unlock git-crypt
        env:
          GIT_CRYPT_KEY_BASE64: ${{ secrets.GIT_CRYPT_KEY_BASE64 }}
        run: |
          echo "$GIT_CRYPT_KEY_BASE64" | base64 -d > /tmp/git-crypt.key
          git-crypt unlock /tmp/git-crypt.key
          rm -f /tmp/git-crypt.key

      # ── Run install ─────────────────────────────────────────────────────────
      - name: Run install
        run: ./install.sh --force

      # ── Stow symlink verification ───────────────────────────────────────────
      - name: Verify stow symlinks
        run: |
          failed=0
          check_link() {
            local link="$1" target_prefix="$2"
            if [ ! -e "$link" ]; then
              echo "ERROR: $link does not exist"
              failed=1
              return
            fi
            # stow folds a package subdir into a single symlink when nothing
            # else lives there, so the symlink may be on a parent directory
            # rather than the file itself. Walk up until we find the symlink.
            local check="$link"
            while [ "$check" != "/" ] && [ ! -L "$check" ]; do
              check="$(dirname "$check")"
            done
            if [ ! -L "$check" ]; then
              echo "ERROR: $link — no symlink found in path (stow did not link it)"
              failed=1
              return
            fi
            resolved="$(readlink -f "$check")"
            if [ "${resolved#"$target_prefix"}" = "$resolved" ]; then
              echo "ERROR: $link -> $resolved (does not point into $target_prefix)"
              failed=1
              return
            fi
            echo "OK: $link -> $resolved"
          }
          REPO="$PWD"
          check_link "$HOME/.bashrc"                         "$REPO"
          check_link "$HOME/.profile"                        "$REPO"
          check_link "$HOME/.gitconfig"                      "$REPO"
          check_link "$HOME/.config/git/hooks/pre-commit"   "$REPO"
          check_link "$HOME/.claude/hooks"                   "$REPO"
          check_link "$HOME/.config/gh/config.yml"          "$REPO"
          check_link "$HOME/.aws/config"                     "$REPO"
          check_link "$HOME/.ssh/config"                     "$REPO"
          check_link "$HOME/.emacs.d/init.el"               "$REPO"
          check_link "$HOME/.ansible.cfg"                    "$REPO"
          exit $failed

      # ── AMD skills submodule ────────────────────────────────────────────────
      - name: Verify vendor/amd-skills submodule populated
        run: |
          for f in \
            vendor/amd-skills/.claude-plugin/marketplace.json \
            vendor/amd-skills/skills
          do
            [ -e "$f" ] && echo "OK: $f" || { echo "ERROR: $f missing (submodule not populated)"; exit 1; }
          done

      # ── Template expansion ──────────────────────────────────────────────────
      - name: Verify template expansions
        run: |
          failed=0
          check_file() {
            local f="$1"
            if [ ! -f "$f" ]; then
              echo "ERROR: $f was not created"
              failed=1
            else
              echo "OK: $f"
            fi
          }
          check_file "$HOME/.config/gh/hosts.yml"
          check_file "$HOME/.docker/config.json"
          check_file "$HOME/.aws/credentials"
          check_file "$HOME/.cache/huggingface/token"
          check_file "$HOME/.config/openrouter-env.sh"
          # Expanded files must not contain un-substituted placeholders
          for f in "$HOME/.config/gh/hosts.yml" "$HOME/.docker/config.json" "$HOME/.aws/credentials"; do
            if grep -q '\${' "$f" 2>/dev/null; then
              echo "ERROR: $f still contains un-expanded placeholders"
              failed=1
            fi
          done
          exit $failed

      # ── File permissions ────────────────────────────────────────────────────
      - name: Verify file permissions on secrets
        run: |
          failed=0
          check_mode() {
            local f="$1" want="$2"
            got="$(stat -c '%a' "$f" 2>/dev/null || echo missing)"
            if [ "$got" != "$want" ]; then
              echo "ERROR: $f permissions $got (want $want)"
              failed=1
            else
              echo "OK: $f mode $got"
            fi
          }
          check_mode "$HOME/.config/gh/hosts.yml"       600
          check_mode "$HOME/.docker/config.json"        600
          check_mode "$HOME/.aws/credentials"           600
          check_mode "$HOME/.cache/huggingface/token"   600
          check_mode "$HOME/.config/openrouter-env.sh"  600
          exit $failed

      # ── Shell syntax ────────────────────────────────────────────────────────
      - name: Shell files parse cleanly
        run: |
          failed=0
          for f in \
            "$HOME/.bashrc" \
            "$HOME/.profile" \
            "$HOME/.config/claude/env.sh" \
            "$HOME/.config/git/hooks/pre-commit"
          do
            if bash -n "$f" 2>&1; then
              echo "OK: $f"
            else
              echo "ERROR: $f failed bash -n"
              failed=1
            fi
          done
          exit $failed

      - name: Pre-commit hook is executable
        run: |
          f="$HOME/.config/git/hooks/pre-commit"
          if [ -x "$f" ]; then
            echo "OK: $f is executable"
          else
            echo "ERROR: $f is not executable"
            exit 1
          fi

      # ── GitHub CLI ──────────────────────────────────────────────────────────
      # Tests that the expanded hosts.yml is valid and the real tokens work.
      # gh reads ~/.config/gh/hosts.yml which install.sh expanded from the
      # unlocked secrets. We test via sbates130272 because stebates_amdeng is
      # an AMD enterprise account whose IP allowlist blocks GitHub Actions runners.
      - name: gh auth status
        run: |
          gh auth status --hostname github.com
          echo "OK: gh auth status passed"

      - name: gh API smoke test (sbates130272)
        run: |
          login="$(gh api user --jq .login)"
          echo "Authenticated as: $login"
          if [ -z "$login" ]; then
            echo "ERROR: gh api user returned empty login"
            exit 1
          fi
          echo "OK: gh api user -> $login"

      # ── AWS ─────────────────────────────────────────────────────────────────
      # Tests that ~/.aws/credentials is valid and the access key is active.
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are stored as repo secrets
      # and must match the values baked into the expanded credentials file.
      - name: aws sts get-caller-identity
        env:
          AWS_PROFILE: batesste
          AWS_DEFAULT_REGION: us-east-1
        run: |
          identity="$(aws sts get-caller-identity --output json)"
          echo "$identity"
          account="$(echo "$identity" | python3 -c 'import sys,json; print(json.load(sys.stdin)["Account"])')"
          if [ -z "$account" ]; then
            echo "ERROR: could not parse Account from sts response"
            exit 1
          fi
          echo "OK: AWS account $account"

      - name: aws config profile is stowed
        run: |
          f="$HOME/.aws/config"
          if [ ! -e "$f" ]; then
            echo "ERROR: $HOME/.aws/config does not exist"
            exit 1
          fi
          echo "OK: $f"
          cat "$f"

      # ── Emacs ───────────────────────────────────────────────────────────────
      # init.el installs rust-mode on first run. Stub out network calls and
      # the package-install/require so the test is hermetic in CI.
      - name: emacs --version
        run: emacs --version

      - name: emacs init.el loads in batch mode
        run: |
          emacs --batch --eval "
            (fset 'package-refresh-contents (lambda (&rest _) nil))
            (fset 'package-initialize (lambda (&rest _) nil))
            (fset 'package-install (lambda (&rest _) nil))
            (fset 'package-installed-p (lambda (&rest _) t))
            (fset 'original-require (symbol-function 'require))
            (fset 'require (lambda (feature &rest args)
              (unless (eq feature 'rust-mode)
                (apply 'original-require feature args))))
            (load \"$HOME/.emacs.d/init.el\")
            (message \"init.el OK\")"

      # ── Ansible ─────────────────────────────────────────────────────────────
      - name: ansible version
        run: |
          ansible --version
          echo "OK: ansible is available"

      - name: ansible.cfg is stowed
        run: |
          f="$HOME/.ansible.cfg"
          if [ ! -e "$f" ]; then
            echo "ERROR: $HOME/.ansible.cfg does not exist"
            exit 1
          fi
          echo "OK: $f"
          cat "$f"

      - name: ansible localhost ping
        run: |
          ansible localhost -m ping -i 'localhost,' -c local
          echo "OK: ansible localhost ping passed"

      - name: ansible-playbook --version
        run: |
          ansible-playbook --version
          echo "OK: ansible-playbook is available"
