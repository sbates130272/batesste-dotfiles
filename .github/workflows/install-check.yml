name: Install check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: install-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets-unlocked:
    name: check_secrets_unlocked() behaviour
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # install.sh guards `main "$@"` with BASH_SOURCE[0] == $0, so sourcing
      # it only loads function definitions without executing anything.
      - name: Exits 0 when secrets dir is absent
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$(mktemp -d)"
          source install.sh
          check_secrets_unlocked && echo "OK: exited 0 as expected"
          EOF

      - name: Exits 1 when secrets file is encrypted (binary)
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$(mktemp -d)"
          mkdir -p "$DOTFILES_DIR/secrets"
          # Write a binary blob that mimics a git-crypt-locked file.
          printf '\x00\x01\x02GITCRYPT\x00' > "$DOTFILES_DIR/secrets/.secrets.env"
          source install.sh
          # check_secrets_unlocked calls exit, so run in a subshell; the
          # || true keeps set -e from firing before we capture rc.
          { ( check_secrets_unlocked ); rc=$?; } || true
          [ "$rc" -ne 0 ] && echo "OK: exited non-zero as expected" || { echo "ERROR: should have exited 1"; exit 1; }
          EOF

      - name: Exits 1 when secrets file is missing entirely
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$(mktemp -d)"
          mkdir -p "$DOTFILES_DIR/secrets"
          # Directory present but file absent — simulates a partial clone.
          source install.sh
          { ( check_secrets_unlocked ); rc=$?; } || true
          [ "$rc" -ne 0 ] && echo "OK: exited non-zero as expected" || { echo "ERROR: should have exited 1"; exit 1; }
          EOF

      - name: Exits 0 when secrets file is plaintext (unlocked)
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$(mktemp -d)"
          mkdir -p "$DOTFILES_DIR/secrets"
          printf 'MY_VAR=hello\n' > "$DOTFILES_DIR/secrets/.secrets.env"
          source install.sh
          check_secrets_unlocked && echo "OK: exited 0 as expected"
          EOF

  proxy-flag:
    name: --proxy flag behaviour
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: --claude-proxy sets default URL when no URL given
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          _CLAUDE_PROXY_URL=""
          argv=(--claude-proxy)
          i=0
          while [[ $i -lt ${#argv[@]} ]]; do
            arg="${argv[$i]}"
            if [[ "$arg" == "--claude-proxy" ]]; then
              if [[ $((i + 1)) -lt ${#argv[@]} && "${argv[$((i + 1))]}" == http* ]]; then
                i=$((i + 1)); _CLAUDE_PROXY_URL="${argv[$i]}"
              else
                _CLAUDE_PROXY_URL="http://127.0.0.1:8888"
              fi
            fi
            i=$((i + 1))
          done
          [ "$_CLAUDE_PROXY_URL" = "http://127.0.0.1:8888" ] && echo "OK: default proxy URL set" \
            || { echo "ERROR: got '$_CLAUDE_PROXY_URL'"; exit 1; }
          EOF

      - name: --claude-proxy accepts explicit URL
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          _CLAUDE_PROXY_URL=""
          argv=(--claude-proxy http://10.0.0.107:8888)
          i=0
          while [[ $i -lt ${#argv[@]} ]]; do
            arg="${argv[$i]}"
            if [[ "$arg" == "--claude-proxy" ]]; then
              if [[ $((i + 1)) -lt ${#argv[@]} && "${argv[$((i + 1))]}" == http* ]]; then
                i=$((i + 1)); _CLAUDE_PROXY_URL="${argv[$i]}"
              else
                _CLAUDE_PROXY_URL="http://127.0.0.1:8888"
              fi
            fi
            i=$((i + 1))
          done
          [ "$_CLAUDE_PROXY_URL" = "http://10.0.0.107:8888" ] && echo "OK: explicit proxy URL set" \
            || { echo "ERROR: got '$_CLAUDE_PROXY_URL'"; exit 1; }
          EOF

      - name: unknown flags are rejected
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          { ( main --unknown-flag ); rc=$?; } || true
          [ "$rc" -ne 0 ] && echo "OK: exited non-zero as expected" || { echo "ERROR: should have exited non-zero"; exit 1; }
          EOF

      - name: --help exits 0
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          { ( main --help ); rc=$?; } || true
          [ "$rc" -eq 0 ] && echo "OK: exited 0" || { echo "ERROR: --help should exit 0"; exit 1; }
          EOF

  zscaler-flag:
    name: --zscaler flag behaviour
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: --zscaler sets _DO_ZSCALER=1
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          _DO_ZSCALER=0
          argv=(--zscaler)
          i=0
          while [[ $i -lt ${#argv[@]} ]]; do
            arg="${argv[$i]}"
            [[ "$arg" == "--zscaler" ]] && _DO_ZSCALER=1
            i=$((i + 1))
          done
          [ "$_DO_ZSCALER" -eq 1 ] && echo "OK: _DO_ZSCALER=1" \
            || { echo "ERROR: _DO_ZSCALER=$_DO_ZSCALER"; exit 1; }
          EOF

      - name: install_zscaler_cert is a no-op without --zscaler
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          _DO_ZSCALER=0
          ran=0
          sudo() { ran=1; }
          install_zscaler_cert
          [ "$ran" -eq 0 ] && echo "OK: no-op when _DO_ZSCALER=0" \
            || { echo "ERROR: sudo was called without --zscaler"; exit 1; }
          EOF

      - name: certs/amd-corp-cert-zscalar.crt exists in the repo
        run: |
          test -f certs/amd-corp-cert-zscalar.crt \
            && echo "OK: cert present" \
            || { echo "ERROR: certs/amd-corp-cert-zscalar.crt missing"; exit 1; }
          openssl x509 -noout -subject -in certs/amd-corp-cert-zscalar.crt \
            && echo "OK: valid PEM cert" \
            || { echo "ERROR: not a valid PEM cert"; exit 1; }
