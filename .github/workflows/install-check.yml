name: Install check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: install-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets-unlocked:
    name: check_secrets_unlocked() behaviour
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # install.sh guards `main "$@"` with BASH_SOURCE[0] == $0, so sourcing
      # it only loads function definitions without executing anything.
      - name: Exits 0 when secrets dir is absent
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$(mktemp -d)"
          source install.sh
          check_secrets_unlocked && echo "OK: exited 0 as expected"
          EOF

      - name: Exits 1 when secrets file is encrypted (binary)
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$(mktemp -d)"
          mkdir -p "$DOTFILES_DIR/secrets"
          # Write a binary blob that mimics a git-crypt-locked file.
          printf '\x00\x01\x02GITCRYPT\x00' > "$DOTFILES_DIR/secrets/.secrets.env"
          source install.sh
          # check_secrets_unlocked calls exit, so run in a subshell; the
          # || true keeps set -e from firing before we capture rc.
          { ( check_secrets_unlocked ); rc=$?; } || true
          [ "$rc" -ne 0 ] && echo "OK: exited non-zero as expected" || { echo "ERROR: should have exited 1"; exit 1; }
          EOF

      - name: Exits 1 when secrets file is missing entirely
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$(mktemp -d)"
          mkdir -p "$DOTFILES_DIR/secrets"
          # Directory present but file absent — simulates a partial clone.
          source install.sh
          { ( check_secrets_unlocked ); rc=$?; } || true
          [ "$rc" -ne 0 ] && echo "OK: exited non-zero as expected" || { echo "ERROR: should have exited 1"; exit 1; }
          EOF

      - name: Exits 0 when secrets file is plaintext (unlocked)
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$(mktemp -d)"
          mkdir -p "$DOTFILES_DIR/secrets"
          printf 'MY_VAR=hello\n' > "$DOTFILES_DIR/secrets/.secrets.env"
          source install.sh
          check_secrets_unlocked && echo "OK: exited 0 as expected"
          EOF

  proxy-flag:
    name: --proxy flag behaviour
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: --proxy flag is accepted (exits 0 in help output)
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          # Verify _DO_PROXY is set by --proxy without running a full install.
          _DO_PROXY=0
          argv=(--proxy)
          for arg in "${argv[@]}"; do
            [ "$arg" = "--proxy" ] && _DO_PROXY=1
          done
          [ "$_DO_PROXY" -eq 1 ] && echo "OK: _DO_PROXY set" || { echo "ERROR: _DO_PROXY not set"; exit 1; }
          EOF

      - name: unknown flags are rejected
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          { ( main --unknown-flag ); rc=$?; } || true
          [ "$rc" -ne 0 ] && echo "OK: exited non-zero as expected" || { echo "ERROR: should have exited non-zero"; exit 1; }
          EOF

      - name: --help exits 0
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          { ( main --help ); rc=$?; } || true
          [ "$rc" -eq 0 ] && echo "OK: exited 0" || { echo "ERROR: --help should exit 0"; exit 1; }
          EOF
