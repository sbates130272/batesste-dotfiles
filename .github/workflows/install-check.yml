name: Install check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: install-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-secrets-unlocked:
    name: check_secrets_unlocked() behaviour
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # install.sh guards `main "$@"` with BASH_SOURCE[0] == $0, so sourcing
      # it only loads function definitions without executing anything.
      - name: Exits 0 when secrets dir is absent
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$(mktemp -d)"
          source install.sh
          check_secrets_unlocked && echo "OK: exited 0 as expected"
          EOF

      - name: Exits 1 when secrets file is encrypted (binary)
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$(mktemp -d)"
          mkdir -p "$DOTFILES_DIR/secrets"
          # Write a binary blob that mimics a git-crypt-locked file.
          printf '\x00\x01\x02GITCRYPT\x00' > "$DOTFILES_DIR/secrets/.secrets.env"
          source install.sh
          # check_secrets_unlocked calls exit, so run in a subshell; the
          # || true keeps set -e from firing before we capture rc.
          { ( check_secrets_unlocked ); rc=$?; } || true
          [ "$rc" -ne 0 ] && echo "OK: exited non-zero as expected" || { echo "ERROR: should have exited 1"; exit 1; }
          EOF

      - name: Exits 1 when secrets file is missing entirely
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$(mktemp -d)"
          mkdir -p "$DOTFILES_DIR/secrets"
          # Directory present but file absent — simulates a partial clone.
          source install.sh
          { ( check_secrets_unlocked ); rc=$?; } || true
          [ "$rc" -ne 0 ] && echo "OK: exited non-zero as expected" || { echo "ERROR: should have exited 1"; exit 1; }
          EOF

      - name: Exits 0 when secrets file is plaintext (unlocked)
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$(mktemp -d)"
          mkdir -p "$DOTFILES_DIR/secrets"
          printf 'MY_VAR=hello\n' > "$DOTFILES_DIR/secrets/.secrets.env"
          source install.sh
          check_secrets_unlocked && echo "OK: exited 0 as expected"
          EOF

  proxy-flag:
    name: --proxy flag behaviour
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: --proxy sets default URL when no URL given
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          # Simulate arg parsing for --proxy with no URL.
          _PROXY_URL=""
          argv=(--proxy)
          i=0
          while [[ $i -lt ${#argv[@]} ]]; do
            arg="${argv[$i]}"
            if [[ "$arg" == "--proxy" ]]; then
              if [[ $((i + 1)) -lt ${#argv[@]} && "${argv[$((i + 1))]}" == http* ]]; then
                i=$((i + 1)); _PROXY_URL="${argv[$i]}"
              else
                _PROXY_URL="http://127.0.0.1:8888"
              fi
            fi
            i=$((i + 1))
          done
          [ "$_PROXY_URL" = "http://127.0.0.1:8888" ] && echo "OK: default proxy URL set" \
            || { echo "ERROR: got '$_PROXY_URL'"; exit 1; }
          EOF

      - name: --proxy accepts explicit URL
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          _PROXY_URL=""
          argv=(--proxy http://10.0.0.107:8888)
          i=0
          while [[ $i -lt ${#argv[@]} ]]; do
            arg="${argv[$i]}"
            if [[ "$arg" == "--proxy" ]]; then
              if [[ $((i + 1)) -lt ${#argv[@]} && "${argv[$((i + 1))]}" == http* ]]; then
                i=$((i + 1)); _PROXY_URL="${argv[$i]}"
              else
                _PROXY_URL="http://127.0.0.1:8888"
              fi
            fi
            i=$((i + 1))
          done
          [ "$_PROXY_URL" = "http://10.0.0.107:8888" ] && echo "OK: explicit proxy URL set" \
            || { echo "ERROR: got '$_PROXY_URL'"; exit 1; }
          EOF

      - name: unknown flags are rejected
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          { ( main --unknown-flag ); rc=$?; } || true
          [ "$rc" -ne 0 ] && echo "OK: exited non-zero as expected" || { echo "ERROR: should have exited non-zero"; exit 1; }
          EOF

      - name: --help exits 0
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          { ( main --help ); rc=$?; } || true
          [ "$rc" -eq 0 ] && echo "OK: exited 0" || { echo "ERROR: --help should exit 0"; exit 1; }
          EOF

      - name: --ca-bundle sets custom source path
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          check_deps() { :; }
          check_secrets_unlocked() { :; }
          init_submodules() { :; }
          check_relocation() { :; }
          version_check() { :; }
          stow_package() { :; }
          expand_templates() { :; }
          bootstrap_buildx_builder() { :; }
          install_git_hooks() { :; }
          record_install() { :; }
          post_install_reminders() { :; }
          main --ca-bundle /tmp/zscaler-custom.crt
          [ "$_CA_BUNDLE_SRC" = "/tmp/zscaler-custom.crt" ] && echo "OK: _CA_BUNDLE_SRC set" || { echo "ERROR: _CA_BUNDLE_SRC not set correctly"; exit 1; }
          EOF

      - name: --ca-bundle without value is rejected
        run: |
          bash <<'EOF'
          DOTFILES_DIR="$PWD"
          source install.sh
          check_deps() { :; }
          check_secrets_unlocked() { :; }
          { ( main --ca-bundle ); rc=$?; } || true
          [ "$rc" -ne 0 ] && echo "OK: exited non-zero as expected" || { echo "ERROR: should have exited non-zero"; exit 1; }
          EOF
