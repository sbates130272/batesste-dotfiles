name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-live-secrets:
    name: no live secrets in plaintext files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets.env is git-crypt encrypted
        run: |
          FILE="secrets/.secrets.env"
          if [ ! -f "$FILE" ]; then
            echo "SKIP: $FILE not present"
            exit 0
          fi
          if file "$FILE" | grep -qE "ASCII|UTF-8|text"; then
            echo "ERROR: $FILE is not encrypted — it must be protected by git-crypt."
            exit 1
          fi
          echo "OK: $FILE is encrypted"

      - name: Check plaintext files contain no secrets
        run: |
          # Globbed rather than listed by name: the previous hardcoded list went
          # stale the moment a template was added, and a file that is silently
          # never scanned is worse than no check at all.
          #
          # Live token shapes only. envsubst placeholders like ${VAR} must not match.
          patterns='sk-ant-[A-Za-z0-9_-]{8}'
          patterns="$patterns|hf_[A-Za-z0-9]{10}"
          patterns="$patterns|gh[pousr]_[A-Za-z0-9]{10}"
          patterns="$patterns|dckr_pat_[A-Za-z0-9_-]{8}"
          patterns="$patterns|AKIA[0-9A-Z]{16}"
          # AMD API gateway key: 32 hex digits following the header name.
          patterns="$patterns|Ocp-Apim-Subscription-Key:[[:space:]]*[0-9a-fA-F]{32}"

          failed=0
          checked=0
          for f in claude/.claude/*.json templates/*; do
            [ -f "$f" ] || continue
            checked=$((checked + 1))
            if grep -qEi "$patterns" "$f"; then
              echo "ERROR: $f appears to contain a live secret."
              failed=1
            else
              echo "OK: $f"
            fi
          done

          # A glob that matches nothing would make this step pass vacuously.
          if [ "$checked" -eq 0 ]; then
            echo "ERROR: no files matched the scan globs — paths must be wrong."
            exit 1
          fi
          echo "Scanned $checked file(s)."
          exit $failed

  stow-structure:
    name: stow package structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install stow
        run: sudo apt-get update && sudo apt-get install -y stow

      - name: Dry-run stow for all packages
        run: |
          DOTFILES_DIR="$PWD"
          TARGET="$(mktemp -d)"
          failed=0
          for pkg in bash claude emacs gh git secrets ssh; do
            if [ -d "$DOTFILES_DIR/$pkg" ]; then
              echo "Checking $pkg..."
              stow --dir="$DOTFILES_DIR" --target="$TARGET" --simulate "$pkg" || {
                echo "ERROR: stow dry-run failed for $pkg"
                failed=1
              }
            fi
          done
          rm -rf "$TARGET"
          exit $failed
