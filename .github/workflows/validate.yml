name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-live-secrets:
    name: no live secrets in settings.json
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check settings.json is git-crypt encrypted
        run: |
          FILE="claude/.claude/settings.json"
          if [ ! -f "$FILE" ]; then
            echo "SKIP: $FILE not present"
            exit 0
          fi
          # Verify the file is git-crypt encrypted (binary blob, not plaintext JSON).
          # git-crypt encrypted files start with the magic header "\x00GITCRYPT".
          if file "$FILE" | grep -q "ASCII\|UTF-8\|JSON"; then
            echo "ERROR: $FILE is not encrypted. It must be protected by git-crypt before committing."
            exit 1
          fi
          echo "OK: $FILE is encrypted"

  stow-structure:
    name: stow package structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install stow
        run: sudo apt-get update && sudo apt-get install -y stow

      - name: Dry-run stow for all packages
        run: |
          DOTFILES_DIR="$PWD"
          TARGET="$(mktemp -d)"
          failed=0
          for pkg in bash claude docker emacs gh git hf ssh; do
            if [ -d "$DOTFILES_DIR/$pkg" ]; then
              echo "Checking $pkg..."
              stow --dir="$DOTFILES_DIR" --target="$TARGET" --simulate "$pkg" || {
                echo "ERROR: stow dry-run failed for $pkg"
                failed=1
              }
            fi
          done
          rm -rf "$TARGET"
          exit $failed
