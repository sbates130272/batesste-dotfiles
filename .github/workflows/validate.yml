name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-live-secrets:
    name: no live secrets in plaintext files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets.env is git-crypt encrypted
        run: |
          FILE="secrets/.secrets.env"
          if [ ! -f "$FILE" ]; then
            echo "SKIP: $FILE not present"
            exit 0
          fi
          if file "$FILE" | grep -qE "ASCII|UTF-8|text"; then
            echo "ERROR: $FILE is not encrypted — it must be protected by git-crypt."
            exit 1
          fi
          echo "OK: $FILE is encrypted"

      - name: Check plaintext files contain no secrets
        run: |
          failed=0
          for f in \
              claude/.claude/settings.json \
              templates/gh-hosts.yml \
              templates/docker-config.json; do
            [ -f "$f" ] || continue
            # Reject real token values; allow envsubst placeholders (${VAR})
            if grep -qP '(sk-ant-|hf_[A-Za-z0-9]{10}|ghp_[A-Za-z0-9]{10}|dckr_pat_)[^\s"]+' "$f"; then
              echo "ERROR: $f appears to contain a live secret."
              failed=1
            else
              echo "OK: $f"
            fi
          done
          exit $failed

  stow-structure:
    name: stow package structure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install stow
        run: sudo apt-get update && sudo apt-get install -y stow

      - name: Dry-run stow for all packages
        run: |
          DOTFILES_DIR="$PWD"
          TARGET="$(mktemp -d)"
          failed=0
          for pkg in bash claude emacs gh git secrets ssh; do
            if [ -d "$DOTFILES_DIR/$pkg" ]; then
              echo "Checking $pkg..."
              stow --dir="$DOTFILES_DIR" --target="$TARGET" --simulate "$pkg" || {
                echo "ERROR: stow dry-run failed for $pkg"
                failed=1
              }
            fi
          done
          rm -rf "$TARGET"
          exit $failed
