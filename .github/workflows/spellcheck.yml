name: Spellcheck

on:
  pull_request:
    branches: [main]
    paths:
      - "**.md"
      - ".spellcheck.yml"
      - ".wordlist.txt"

permissions:
  contents: read

concurrency:
  group: spellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spellcheck:
    name: spellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: GitHub Spellcheck Action
        uses: rojopolis/spellcheck-github-actions@v0
        with:
          config_path: .spellcheck.yml
