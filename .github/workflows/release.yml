name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The changelog is generated by GitHub rather than from git log. PRs are
      # squash-merged here, so a whole PR collapses to one commit and a log-based
      # changelog degrades to a single auto-generated branch name. GitHub lists
      # the merged PRs themselves, which survives squashing.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Installing

            ```bash
            git clone git@github.com:sbates130272/batesste-dotfiles.git ~/Projects/batesste-dotfiles
            cd ~/Projects/batesste-dotfiles
            git-crypt unlock
            ./install.sh
            ```

            Upgrading an existing machine may need `./install.sh --force`; see the
            notes below for anything release-specific.
